name: Build TwinGlow IPA

on:
  push:
    branches: [main]
    paths:
      - "twinglow/**"
      - ".github/workflows/twinglow.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-twinglow
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45
    defaults:
      run:
        working-directory: twinglow
    steps:
      - uses: actions/checkout@v6

      - name: Build app (unsigned)
        run: |
          xcodebuild -version > xcode-version.txt
          brew install xcodegen > /dev/null
          xcodegen generate > xcodegen.log 2>&1
          xcodebuild \
            -project TwinGlow.xcodeproj \
            -scheme TwinGlow \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build > build.log 2>&1 || true
          grep -E "error:|BUILD (SUCCEEDED|FAILED)" build.log | head -60 || true
          grep -q "BUILD SUCCEEDED" build.log

      - name: Package IPA
        run: |
          APP="build/Build/Products/Release-iphoneos/TwinGlow.app"
          codesign --force --sign - "$APP"
          mkdir -p out/Payload
          cp -R "$APP" out/Payload/
          (cd out && zip -qry ../TwinGlow.ipa Payload)
          ls -la TwinGlow.ipa

      - uses: actions/upload-artifact@v6
        with:
          name: TwinGlow-ipa
          path: twinglow/TwinGlow.ipa

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Not marked "Latest", so the repo's Latest release stays 萤格.
          gh release create "twinglow-${{ github.run_number }}" TwinGlow.ipa \
            --title "双萤 第 ${{ github.run_number }} 版" \
            --notes "在 iPhone 上用 Safari 下载 TwinGlow.ipa，然后用 SideStore 安装。" \
            --latest=false

      - name: Write build report
        if: always()
        run: |
          {
            echo "run: ${{ github.run_number }}"
            echo "commit: ${{ github.sha }}"
            echo "result: ${{ job.status }}"
            cat xcode-version.txt 2>/dev/null
            echo "---- errors ----"
            grep -E "error:" build.log 2>/dev/null | sort -u | head -200
            echo "---- warnings ----"
            grep -E "warning:" build.log 2>/dev/null | sort -u | head -80
            echo "---- xcodegen ----"
            tail -20 xcodegen.log 2>/dev/null
            echo "---- build log tail ----"
            tail -80 build.log 2>/dev/null
          } > /tmp/report.txt
          rm -rf /tmp/rep && mkdir /tmp/rep && cd /tmp/rep
          git init -q
          git checkout -q -b build-report-twinglow
          cp /tmp/report.txt report.txt
          git add report.txt
          git -c user.name="build-bot" -c user.email="build-bot@users.noreply.github.com" commit -qm "twinglow report ${{ github.run_number }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" build-report-twinglow
